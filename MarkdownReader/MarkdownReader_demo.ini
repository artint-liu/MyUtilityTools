# MarkdownReader 字体配置
# 值为字体的 family name（字体内部名，不是文件名）。
# 留空或省略则自动检测（首个 family 作正文、首个等宽作代码）。
# 若配置的字体不在 fonts 目录中，回退自动检测，再回退系统默认。

body = 苹方黑体-中粗-简.ttf
code = SourceCodePro-Regular.ttf

# 目录面板（左侧 TOC）字体配置（可选）
# toc：目录字体文件名或 family name，留空则复用 body
# tocSize：目录字号，默认 15（越大字号越大）
# tocLineSpacing：目录行高数值，默认 40（越大行间距越疏）
toc =
tocSize = 15
tocLineSpacing = 40
