# ML-Agents PPO config - MiniChicken biped velocity command following
# Usage: mlagents-learn training/biped_locomotion.yaml --run-id=biped_v1

behaviors:
  BipedLocomotion:
    trainer_type: ppo
    hyperparameters:
      batch_size: 4096
      buffer_size: 40960
      learning_rate: 3.0e-4
      beta: 0.005          # entropy regularization, encourages gait exploration
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3
      learning_rate_schedule: linear
    network_settings:
      normalize: true      # auto-normalize inputs
      hidden_units: 512
      num_layers: 3
      vis_encode_type: simple
    reward_signals:
      extrinsic:
        gamma: 0.99
        strength: 1.0
    max_steps: 5.0e7       # with 16 parallel envs, needs tens of millions of steps to converge
    time_horizon: 64
    summary_freq: 30000
    keep_checkpoints: 5
    checkpoint_interval: 500000
    threaded: true

# Inference test (optional): drop --run-id and add --inference to mlagents-learn
engine_settings:
  width: 84
  height: 84
  quality_level: 5
  time_scale: 20          # Unity Time Scale during training (also settable in Edit > Project Settings > Time)
