behaviors:
  QuadrupedLocomotion:
    trainer_type: ppo
    hyperparameters:
      batch_size: 4096
      buffer_size: 40960
      learning_rate: 0.0003
      beta: 0.005
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3
      learning_rate_schedule: linear
    network_settings:
      normalize: true
      hidden_units: 512
      num_layers: 3
      vis_encode_type: simple
      use_recurrent: true
      memory_size: 256
      sequence_length: 64
    reward_signals:
      extrinsic:
        gamma: 0.99
        strength: 1
    max_steps: 50000000
    time_horizon: 64
    summary_freq: 30000
    keep_checkpoints: 5
    checkpoint_interval: 500000
    threaded: true
engine_settings:
  width: 84
  height: 84
  quality_level: 5
  time_scale: 20
